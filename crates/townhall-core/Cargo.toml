[package]
name = "townhall-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt", "macros", "time", "sync", "fs", "io-util"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
