[workspace]

[package]
name = "townhall-gpui"
version = "0.2.0-alpha.1"
edition = "2021"
license = "MIT"
description = "Native GPUI app for townhall: hosts the daemon in-process and shows conversations live"
default-run = "townhall-native"

[[bin]]
name = "townhall-native"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = "=0.9.1"
townhall-core = { path = "../townhall-core" }
townhall-daemon = { path = "../townhall-daemon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
async-channel = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
libc = "0.2"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
tempfile = "3"
